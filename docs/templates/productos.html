<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rinconcito - Productos</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1e1e2f;
            color: #fff;
            margin: 0;
            padding: 24px;
        }
        h1 {
            text-align: center;
        }
        .volver {
            display: inline-block;
            margin-bottom: 20px;
            color: #9ab4ff;
            text-decoration: none;
        }
        form {
            background: #2e2e42;
            border-radius: 12px;
            padding: 20px;
            max-width: 400px;
            margin: 0 auto 32px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input {
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
        }
        button {
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #4caf50;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #43a047;
        }
        table {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #3d3d5c;
        }
        .eliminar {
            color: #ff6b6b;
            text-decoration: none;
        }
        .eliminar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a class="volver" href="{{ url_for('inicio') }}">&larr; Volver al inicio</a>
    <h1>Registrar productos</h1>

    {% if error %}
    <p style="max-width:400px;margin:0 auto 16px auto;color:#ff6b6b;text-align:center;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('productos') }}">
        <input type="text" name="nombre" placeholder="Nombre del producto" required>
        <input type="number" name="precio" placeholder="Precio (MXN)" step="0.01" min="0" required>
        <button type="submit">Agregar producto</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Precio</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for producto in productos %}
            <tr>
                <td>{{ producto['nombre'] }}</td>
                <td>${{ "%.2f"|format(producto['precio']) }}</td>
                <td><a class="eliminar" href="{{ url_for('eliminar_producto', producto_id=producto['id']) }}">Eliminar</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
