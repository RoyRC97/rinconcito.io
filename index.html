<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Rinconcito</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1e1e2f;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 24px;
        }
        h1 {
            font-size: 2.4rem;
            color: #ffa500;
            margin-bottom: 8px;
        }
        p {
            color: #ccc;
            margin-bottom: 32px;
            max-width: 400px;
        }
        a.boton {
            text-decoration: none;
            background: #4caf50;
            color: white;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background 0.15s ease;
        }
        a.boton:hover {
            background: #43a047;
        }
    </style>
</head>
<body>
    <h1>🍽️ El Rinconcito</h1>
    <p>Sistema de pedidos y control de productos para el bar.</p>
    <a class="boton" href="https://rodrigo01.pythonanywhere.com">Entrar a la app</a>
</body>
</html>
